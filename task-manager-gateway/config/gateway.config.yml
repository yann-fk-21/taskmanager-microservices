http:
  port: 8080
admin:
  port: 9876
  host: localhost
apiEndpoints:
  api:
    host: '*'
    paths: '/ip'
  users:
    host: '*'
    methods: 'GET, POST, PUT, DELETE'
    paths: '/api/v1/users*'
  tasks:
    host: '*'
    methods: 'GET, POST, PUT, DELETE'
    paths: '/api/v1/tasks*'
  auth:
    host: '*'
    methods: 'GET, POST, PUT, DELETE'
    paths: '/api/v1/auth*'
serviceEndpoints:
  httpbin:
    url: 'https://httpbin.org'
  userService:
    url: 'http://user-service:8000'
  taskService:
    url: 'http://task-service:8001'
  authService:
    url: 'http://auth-service:8002'
policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
pipelines:
  default:
    apiEndpoints:
      - api
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - rate-limit:
          - action:
            max: 20
            windowMs: 120000
            rateLimitBy: '${req.hostname}'
      - proxy:
          - action:
              serviceEndpoint: httpbin
              changeOrigin: true

  users:
    apiEndpoints:
      - users
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - rate-limit:
          - action:
            max: 20
            windowMs: 120000
            rateLimitBy: '${req.hostname}'
      - proxy:
          - action:
              serviceEndpoint: userService
              changeOrigin: true

  tasks:
    apiEndpoints:
      - tasks
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - rate-limit:
          - action:
            max: 20
            windowMs: 120000
            rateLimitBy: '${req.hostname}'

      - proxy:
          - action:
              serviceEndpoint: taskService
              changeOrigin: true

  auth:
    apiEndpoints:
      - auth
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - log:
          - action:
            message: '${req.method} ${req.originalUrl}'
      - rate-limit:
          - action:
            max: 20
            windowMs: 120000
            rateLimitBy: '${req.hostname}'

      - proxy:
          - action:
              serviceEndpoint: authService
              changeOrigin: true
